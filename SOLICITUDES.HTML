<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Solicitudes de Compra</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f9;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    form {
      background: white;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      max-width: 600px;
      margin: auto;
      display: grid;
      gap: 1rem;
    }
    input, select, button {
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
    }
    button {
      background-color: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    table {
      width: 100%;
      margin-top: 2rem;
      border-collapse: collapse;
    }
    th, td {
      padding: 0.5rem;
      border: 1px solid #ccc;
      text-align: center;
    }
    th {
      background-color: #007bff;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Registro de Solicitudes de Compra</h1>
  <form id="solicitudForm">
    <input type="text" id="material" placeholder="Material" required />
    <input type="number" id="cantidad" placeholder="Cantidad" required />
    <input type="text" id="proveedor" placeholder="Proveedor" required />
    <input type="number" step="0.01" id="costo" placeholder="Costo" required />
    <input type="date" id="fecha" required />
    <button type="submit">Agregar Solicitud</button>
  </form>

  <table id="tablaSolicitudes">
    <thead>
      <tr>
        <th>Material</th>
        <th>Cantidad</th>
        <th>Proveedor</th>
        <th>Costo</th>
        <th>Fecha Solicitud</th>
        <th>Estado</th>
        <th>Fecha Completado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const form = document.getElementById('solicitudForm');
    const tabla = document.getElementById('tablaSolicitudes').querySelector('tbody');

    let solicitudes = JSON.parse(localStorage.getItem('solicitudes')) || [];

    function renderTabla() {
      tabla.innerHTML = '';
      solicitudes.forEach((s, i) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${s.material}</td>
          <td>${s.cantidad}</td>
          <td>${s.proveedor}</td>
          <td>$${s.costo.toFixed(2)}</td>
          <td>${s.fecha}</td>
          <td>
            <select onchange="cambiarEstado(${i}, this.value)">
              <option ${s.estado === 'En proceso de solicitud' ? 'selected' : ''}>En proceso de solicitud</option>
              <option ${s.estado === 'En proceso de cotización' ? 'selected' : ''}>En proceso de cotización</option>
              <option ${s.estado === 'Solicitado' ? 'selected' : ''}>Solicitado</option>
              <option ${s.estado === 'Completado' ? 'selected' : ''}>Completado</option>
            </select>
          </td>
          <td><input type="date" value="${s.fechaCompletado || ''}" onchange="actualizarFechaCompletado(${i}, this.value)" ${s.estado !== 'Completado' ? 'disabled' : ''}></td>
          <td><button onclick="eliminar(${i})">Eliminar</button></td>
        `;
        tabla.appendChild(row);
      });
    }

    function cambiarEstado(index, estado) {
      solicitudes[index].estado = estado;
      if (estado !== 'Completado') solicitudes[index].fechaCompletado = '';
      guardarYRender();
    }

    function actualizarFechaCompletado(index, fecha) {
      solicitudes[index].fechaCompletado = fecha;
      guardarYRender();
    }

    function eliminar(index) {
      if (confirm('¿Eliminar esta solicitud?')) {
        solicitudes.splice(index, 1);
        guardarYRender();
      }
    }

    function guardarYRender() {
      localStorage.setItem('solicitudes', JSON.stringify(solicitudes));
      renderTabla();
    }

    form.onsubmit = e => {
      e.preventDefault();
      const nueva = {
        material: form.material.value,
        cantidad: parseInt(form.cantidad.value),
        proveedor: form.proveedor.value,
        costo: parseFloat(form.costo.value),
        fecha: form.fecha.value,
        estado: 'En proceso de solicitud',
        fechaCompletado: ''
      };
      solicitudes.push(nueva);
      guardarYRender();
      form.reset();
    };

    renderTabla();
  </script>
</body>
</html>
